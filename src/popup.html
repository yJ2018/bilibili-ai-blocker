<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>B站 AI 内容屏蔽</title>
  </head>
  <body>
    <header class="head">
      <img class="logo" src="../icons/icon48.png" alt="" />
      <div class="titles">
        <h1>B站 AI 内容屏蔽</h1>
        <p id="status">正在读取状态…</p>
      </div>
      <label class="switch" title="总开关">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
      </label>
    </header>

    <section class="stats">
      <button class="stat" id="hiddenStat" type="button" title="点击查看被屏蔽的卡片">
        <b id="hiddenCount">0</b>
        <span>已屏蔽</span>
      </button>
      <div class="stat">
        <b id="checkedCount">0</b>
        <span>已检查</span>
      </div>
      <div class="stat">
        <b id="totalCount">0</b>
        <span>页面卡片</span>
      </div>
    </section>

    <p class="hint-line" id="listHint" hidden>点「已屏蔽」查看并放行被屏蔽的卡片</p>

    <section class="preview" id="preview" hidden>
      <div class="preview-head">
        <span>被屏蔽的卡片</span>
        <button class="link" id="clearAllow" type="button">清空放行记录</button>
      </div>
      <ul class="list" id="list"></ul>
    </section>

    <details class="settings" id="settings" open>
      <summary>拦截设置</summary>
      <section class="opts">
        <label class="opt">
          <input type="checkbox" id="useApi" />
          <span>
            <strong>校验 B 站 AI 声明</strong>
            <em>官方声明，最准；每个视频只查一次</em>
          </span>
        </label>
        <label class="opt">
          <input type="checkbox" id="useDom" />
          <span>
            <strong>识别页面 AI 角标</strong>
            <em>卡片带 AI 字样时立即隐藏</em>
          </span>
        </label>
        <label class="opt">
          <input type="checkbox" id="hideLive" />
          <span>
            <strong>隐藏直播卡片</strong>
            <em>「直播中」楼层卡与直播间卡片</em>
          </span>
        </label>
        <label class="opt">
          <input type="checkbox" id="hideBanner" />
          <span>
            <strong>隐藏顶部推广横幅</strong>
            <em>顶部活动推广，收起为窄导航条</em>
          </span>
        </label>
        <label class="opt">
          <input type="checkbox" id="hideHero" />
          <span>
            <strong>隐藏左侧推荐大图</strong>
            <em>左侧 2×2 大图位，卡片自动补位</em>
          </span>
        </label>
        <label class="opt">
          <input type="checkbox" id="hideSideButtons" />
          <span>
            <strong>隐藏右侧「稍后再看」</strong>
            <em>右侧圆形按钮，仅藏「稍后再看」</em>
          </span>
        </label>
        <label class="opt">
          <input type="checkbox" id="guess" />
          <span>
            <strong>标题关键词猜测</strong>
            <em>命中 AI 工具名就隐藏，易误伤</em>
          </span>
        </label>
        <label class="opt">
          <input type="checkbox" id="markOnly" />
          <span>
            <strong>只标注不隐藏（调试）</strong>
            <em>粉色虚线框标注，不隐藏</em>
          </span>
        </label>
      </section>

      <details class="extra">
        <summary>自定义关键词（追加到角标识别）</summary>
        <textarea
          id="keywords"
          rows="3"
          spellcheck="false"
          placeholder="用逗号分隔，例如：AI生成, AI制作, 含AI生成内容"
        ></textarea>
      </details>
    </details>

    <footer class="foot">
      <button id="rescan" type="button">重新扫描当前页</button>
      <span class="hint">改动立即生效</span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
